name: Build Verden
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build-log.txt

      - name: Show build errors
        if: failure()
        run: |
          echo "===== LOG DO BUILD ====="
          cat build-log.txt
          echo "===== FIM DO LOG ====="

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verden-mod
          path: build/libs/*.jar