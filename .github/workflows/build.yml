name: Build Verden

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compile
        run: |
          set -o pipefail
          gradle compileJava --stacktrace 2>&1 | tee compile.log

      - name: Publish compilation error
        if: failure()
        run: |
          echo "::error file=compile.log::A compilação Java falhou. Veja o log abaixo."
          echo "===== ERRO DE COMPILAÇÃO ====="
          grep -n -B 8 -A 15 -E "error:|cannot find symbol|symbol:|location:" compile.log || cat compile.log
          echo "===== FIM ====="

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-log
          path: compile.log